<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Aether Cinema</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-container": "#e1aa12",
                      "on-surface": "#dae2fd",
                      "on-error": "#690005",
                      "surface-variant": "#2d3449",
                      "primary": "#ffc639",
                      "tertiary-fixed": "#e2e2e2",
                      "on-primary-fixed": "#261a00",
                      "inverse-on-surface": "#283044",
                      "outline-variant": "#4d4635",
                      "on-background": "#dae2fd",
                      "surface-dim": "#0b1326",
                      "surface-container-low": "#131b2e",
                      "on-primary-container": "#594100",
                      "inverse-primary": "#795900",
                      "surface-bright": "#31394d",
                      "on-secondary": "#273143",
                      "error-container": "#93000a",
                      "secondary-fixed": "#d8e3fb",
                      "on-secondary-container": "#b2bcd3",
                      "surface-container-lowest": "#060e20",
                      "surface-tint": "#f7be2c",
                      "surface-container-highest": "#2d3449",
                      "tertiary-fixed-dim": "#c6c6c6",
                      "primary-fixed-dim": "#f7be2c",
                      "on-tertiary": "#2f3131",
                      "on-tertiary-fixed-variant": "#454747",
                      "on-surface-variant": "#d0c5af",
                      "secondary": "#bcc7de",
                      "error": "#ffb4ab",
                      "surface": "#0b1326",
                      "inverse-surface": "#dae2fd",
                      "surface-container": "#171f33",
                      "primary-fixed": "#ffdf9e",
                      "on-primary": "#3f2e00",
                      "on-tertiary-fixed": "#1a1c1c",
                      "on-tertiary-container": "#444546",
                      "background": "#0b1326",
                      "on-secondary-fixed-variant": "#3d475a",
                      "tertiary": "#cecece",
                      "on-secondary-fixed": "#111c2d",
                      "tertiary-container": "#b2b3b3",
                      "surface-container-high": "#222a3d",
                      "secondary-container": "#424c5f",
                      "on-primary-fixed-variant": "#5b4300",
                      "secondary-fixed-dim": "#bcc7de",
                      "on-error-container": "#ffdad6",
                      "outline": "#99907c"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "xxl": "1.5rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Epilogue"],
                      "body": ["Manrope"],
                      "label": ["Manrope"]
              }
            },
          },
        }
      </script>
</head>
<body class="bg-surface text-on-surface font-body overflow-hidden">
<!-- Background Cinematic Atmosphere -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-gradient-to-b from-surface/40 via-surface/80 to-surface z-10"></div>
<img class="w-full h-full object-cover filter blur-md scale-105" data-alt="Cinematic wide shot of an empty luxury theater with soft amber ambient lighting and deep shadows creating a moody atmosphere" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC16AvMhBtHhevI1P4BF7JhXyIxc7o4juq1vojgldf6FlEojknzxoS13k-a_nGvQvYTytqZjyXjkovBlianWk9ZVjzuBJ1CT4IOOOsyiEk7_tlxRif2kWEm-hqZ9GNSxRgdsZPAAd2QqFjl3d8EjEt9i-qRbgWWFEq7V9eXtSb6aNuRDQph4iW_pFf23N7yzrj7og1AHyykrMR88TlJ2n0dnxXmLtVSwUkMQOqFAEv286mHrjV3TwZN4qgdlLDPKWxVgOyGR2Z0KzY"/>
</div>
<!-- Navigation -->
<nav class="fixed top-0 w-full z-50 flex justify-between items-center px-8 py-6 bg-transparent">
<div class="text-2xl font-bold tracking-tight text-[#ffc639] uppercase font-headline">
            Aether Cinema
        </div>
<div class="flex items-center gap-6">
<button class="text-[#dae2fd] opacity-80 hover:text-[#ffc639] transition-colors duration-300">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</div>
</nav>
<!-- Main Content: Login Shell -->
<main class="relative z-20 min-h-screen flex items-center justify-center px-6">
<div class="w-full max-w-md">
<div class="glass-card bg-surface-variant/40 rounded-xxl p-8 md:p-10 border border-outline-variant/15 shadow-2xl">
<!-- Title & Header -->
<div class="text-center mb-10">
<h1 class="font-headline text-3xl md:text-4xl font-bold text-on-surface mb-2 tracking-tight">The Screen Awaits</h1>
<p class="text-on-surface-variant font-medium text-sm md:text-base">Sign in to access your curated collection.</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<div class="space-y-1.5">
<label class="text-[11px] font-medium uppercase tracking-widest text-on-surface-variant ml-1">Email Address</label>
<input class="w-full bg-surface-container-highest/60 border border-outline-variant/30 rounded-xl px-4 py-3.5 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="name@example.com" type="email"/>
</div>
<div class="space-y-1.5">
<label class="text-[11px] font-medium uppercase tracking-widest text-on-surface-variant ml-1">Password</label>
<input class="w-full bg-surface-container-highest/60 border border-outline-variant/30 rounded-xl px-4 py-3.5 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center justify-between text-sm">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded border-outline-variant bg-surface-container-highest text-primary focus:ring-primary focus:ring-offset-surface-variant" type="checkbox"/>
<span class="text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="text-primary/80 hover:text-primary font-medium transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold py-4 rounded-full shadow-lg shadow-primary/10 hover:shadow-primary/25 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200" type="submit">
                        Sign In
                    </button>
</form>
<!-- Divider -->
<!-- Social Logins -->
<div class="text-center mt-8">
<p class="text-on-surface-variant text-sm">New to the gallery? <a class="text-primary font-bold hover:underline underline-offset-4" href="#">Create an account</a></p>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full z-50 flex flex-col md:flex-row justify-between items-center px-8 py-4 opacity-60">
<div class="text-[11px] font-medium uppercase tracking-widest text-[#dae2fd] mb-4 md:mb-0">
            © 2024 Aether Cinema. All rights reserved.
        </div>
<div class="flex flex-wrap justify-center gap-6">
<a class="text-[11px] font-medium uppercase tracking-widest text-[#dae2fd] opacity-40 hover:text-[#ffc639] hover:opacity-100 transition-all" href="#">Terms of Service</a>
<a class="text-[11px] font-medium uppercase tracking-widest text-[#dae2fd] opacity-40 hover:text-[#ffc639] hover:opacity-100 transition-all" href="#">Privacy Policy</a>
<a class="text-[11px] font-medium uppercase tracking-widest text-[#dae2fd] opacity-40 hover:text-[#ffc639] hover:opacity-100 transition-all" href="#">Cookie Preferences</a>
<a class="text-[11px] font-medium uppercase tracking-widest text-[#dae2fd] opacity-40 hover:text-[#ffc639] hover:opacity-100 transition-all" href="#">Contact Support</a>
</div>
</footer>
</body></html>
