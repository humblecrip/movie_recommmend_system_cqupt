<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinemaAI - 后台仪表盘</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#151f31,#111927);color:#fff}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}
    .layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#161f30,#172131 70%,#141d2c);border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column}.brandbar{height:76px;padding:0 28px;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}.brand{display:flex;align-items:center;gap:12px;font-size:22px}.brand-mark{width:34px;height:34px;border-radius:50%;border:2px solid #f0c454;color:#f0c454;display:grid;place-items:center;font-weight:700}.brand strong{color:#f0c454}
    .sidenav{padding:26px 20px;display:grid;gap:12px}.link{height:58px;padding:0 18px;border-radius:14px;display:flex;align-items:center;gap:14px;font-size:16px}.icon{width:18px;height:18px;border:2px solid currentColor;border-radius:4px}.link.active{background:linear-gradient(180deg,rgba(240,196,84,.82),rgba(164,132,53,.82));color:#251d13}.userbox{margin-top:auto;padding:20px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}.userleft{display:flex;align-items:center;gap:12px}.avatar{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.25);object-fit:cover}.muted{color:#aeb6c6}
    .main{background:linear-gradient(180deg,#151f31,#111927)}.top{height:76px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}.search{flex:1;max-width:460px;height:48px;border-radius:16px;padding:0 18px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;outline:none}.right{display:flex;align-items:center;gap:14px;margin-left:20px}.search-icon{width:22px;height:22px;border:2px solid #fff;border-radius:50%;position:relative}.search-icon:after{content:"";position:absolute;width:10px;height:2px;background:#fff;right:-6px;bottom:-3px;transform:rotate(45deg)}
    .page{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:rgba(33,39,53,.88);border:1px solid rgba(170,197,226,.15);border-radius:24px;padding:20px;box-shadow:0 18px 42px rgba(0,0,0,.34)}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{margin:0;font-size:20px}.head span{color:#aeb6c6;font-size:13px}
    .chart{width:100%;height:240px}.labels{display:flex;justify-content:space-between;color:#aeb6c6;font-size:13px}.bars{display:grid;gap:14px;margin-top:12px}.bar{display:grid;grid-template-columns:90px 1fr 46px;gap:12px;align-items:center}.track{height:14px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#1ebf8f,#42ef7c);box-shadow:0 0 20px rgba(39,216,140,.22)}.rank{display:grid;gap:16px}.item{display:grid;grid-template-columns:74px 1fr auto;gap:14px;align-items:center}.item img{width:74px;height:74px;border-radius:18px;object-fit:cover}.score{color:#f0c454;font-weight:700}
    @media(max-width:1100px){.layout,.grid{grid-template-columns:1fr}.sidebar{display:none}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar"><div class="brandbar"><div class="brand"><div class="brand-mark">CA</div><span>Cinema<strong>AI</strong></span></div></div><nav class="sidenav"><a class="link active" href="./admin-dashboard.html"><span class="icon"></span><span>仪表盘</span></a><a class="link" href="./admin-movie-edit.html"><span class="icon"></span><span>电影管理</span></a><a class="link" href="./admin-users.html"><span class="icon"></span><span>用户管理</span></a><a class="link" href="./admin-login.html"><span class="icon"></span><span>系统设置</span></a></nav><div class="userbox"><div class="userleft"><img class="avatar" src="../src/main/resources/static/upload/image1.jpg" alt="管理员"><div><div>管理员</div><div class="muted">超级账号</div></div></div><div class="muted">⌄</div></div></aside>
    <main class="main">
      <header class="top"><input class="search" placeholder="搜索影片、用户、评论或统计数据"><div class="right"><div class="search-icon"></div><img class="avatar" src="../src/main/resources/static/upload/image1.jpg" alt="管理员"></div></header>
      <section class="page"><div class="grid">
        <article class="card"><div class="head"><h2>月度评分趋势</h2><span>近 12 个月</span></div><svg class="chart" viewBox="0 0 520 260"><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#39a8ff" stop-opacity=".88"/><stop offset="100%" stop-color="#39a8ff" stop-opacity=".08"/></linearGradient></defs><g stroke="rgba(255,255,255,.08)"><line x1="36" y1="28" x2="504" y2="28"/><line x1="36" y1="84" x2="504" y2="84"/><line x1="36" y1="140" x2="504" y2="140"/><line x1="36" y1="196" x2="504" y2="196"/></g><path d="M36 210 C68 150,82 122,110 156 S162 194,196 128 S246 176,280 132 S324 186,358 118 S416 198,446 146 S484 118,504 110 L504 240 L36 240 Z" fill="url(#b)"/><path d="M36 210 C68 150,82 122,110 156 S162 194,196 128 S246 176,280 132 S324 186,358 118 S416 198,446 146 S484 118,504 110" fill="none" stroke="#39a8ff" stroke-width="4" stroke-linecap="round"/></svg><div class="labels"><span>1月</span><span>2月</span><span>3月</span><span>4月</span><span>5月</span><span>6月</span><span>7月</span><span>8月</span><span>9月</span><span>10月</span><span>11月</span><span>12月</span></div></article>
        <article class="card"><div class="head"><h2>实时用户活跃度</h2><span>实时在线数据</span></div><svg class="chart" viewBox="0 0 520 260"><defs><linearGradient id="o" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff8967" stop-opacity=".7"/><stop offset="100%" stop-color="#ff8967" stop-opacity=".06"/></linearGradient></defs><g stroke="rgba(255,255,255,.08)"><line x1="36" y1="28" x2="504" y2="28"/><line x1="36" y1="84" x2="504" y2="84"/><line x1="36" y1="140" x2="504" y2="140"/><line x1="36" y1="196" x2="504" y2="196"/></g><path d="M36 220 C54 164,84 168,116 204 S170 166,204 194 S256 172,286 98 S336 196,372 154 S422 126,452 174 S486 166,504 144 L504 240 L36 240 Z" fill="url(#o)"/><path d="M36 220 C54 164,84 168,116 204 S170 166,204 194 S256 172,286 98 S336 196,372 154 S422 126,452 174 S486 166,504 144" fill="none" stroke="#ff8f73" stroke-width="4" stroke-linecap="round"/></svg><div class="labels"><span>0</span><span>5</span><span>10</span><span>15</span><span>20</span><span>25</span><span>30 分钟</span></div></article>
        <article class="card"><div class="head"><h2>影片类型热度分布</h2><span>基于收藏与评分</span></div><div class="bars"><div class="bar"><span>动作</span><div class="track"><div class="fill" style="width:96%"></div></div><strong>9.8</strong></div><div class="bar"><span>喜剧</span><div class="track"><div class="fill" style="width:91%"></div></div><strong>9.5</strong></div><div class="bar"><span>剧情</span><div class="track"><div class="fill" style="width:68%"></div></div><strong>6.2</strong></div><div class="bar"><span>悬疑</span><div class="track"><div class="fill" style="width:52%"></div></div><strong>4.7</strong></div><div class="bar"><span>科幻</span><div class="track"><div class="fill" style="width:36%"></div></div><strong>2.8</strong></div><div class="bar"><span>爱情</span><div class="track"><div class="fill" style="width:31%"></div></div><strong>2.3</strong></div></div></article>
        <article class="card"><div class="head"><h2>近期推荐榜单</h2><span>系统自动排序</span></div><div class="rank"><div class="item"><img src="../src/main/resources/static/upload/dianyingxinxi_haibao3.jpg" alt="推荐"><strong>1. 星际灯塔：余晖计划</strong><span class="score">9.8 分</span></div><div class="item"><img src="../src/main/resources/static/upload/dianyingxinxi_haibao6.jpg" alt="推荐"><strong>2. 复仇者：终局决战</strong><span class="score">9.5 分</span></div><div class="item"><img src="../src/main/resources/static/upload/dianyingxinxi_haibao4.jpg" alt="推荐"><strong>3. 寄生边界：暗潮来袭</strong><span class="score">9.2 分</span></div></div></article>
      </div></section>
    </main>
  </div>
</body>
</html>
